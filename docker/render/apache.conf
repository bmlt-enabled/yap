# yap is served from the src/ root (index.php + .htaccess live there, assets are
# under /public), matching a normal release-zip install.
ServerName localhost

<VirtualHost *:${PORT}>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Everything but index.php and public/ is application code, config or state.
    # Block direct requests to it; Laravel routes still reach index.php via the
    # .htaccess rewrite.
    <DirectoryMatch "^${APACHE_DOCUMENT_ROOT}/(app|bootstrap|config|database|lang|resources|routes|scripts|storage|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(\..*|composer\.(json|lock)|package(-lock)?\.json|artisan|Makefile|phpunit\.xml|webpack\.mix\.js|config(\..+)?\.php|server\.php)$">
        Require all denied
    </FilesMatch>

    # Logs go to the container's stdout/stderr, which Render captures.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
