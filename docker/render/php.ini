; Tuned for Render's free tier (512 MB RAM, 0.1 CPU).
memory_limit = 192M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
upload_max_filesize = 16M
post_max_size = 16M

opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
; The code is baked into the image and never changes at runtime.
opcache.validate_timestamps = 0
