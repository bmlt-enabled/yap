name: lint
description: "Lint"

runs:
  using: composite
  steps:
    - name: PHPCS checker
      id: php-codesniffer
      run: |
        cd src
        vendor/squizlabs/php_codesniffer/bin/phpcs
      shell: bash

    - name: Session has() value-position guard
      run: |
        cd src
        bash scripts/session-has-value-position-guard.sh
      shell: bash
