name: 'pull-request'

on:
  pull_request:
    branches: [ 'main', '4.4.x' ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        db:
          - mysql-8.0
        include:
          - db: mysql-8.0
            db-image: 'mysql/mysql-server:8.0'
          # MariaDB (#1679): 10.3 is the documented minimum (PreflightService::
          # MARIADB_MIN_VERSION), 10.6 the oldest LTS still common on shared
          # hosting, 11.4 a current LTS.
          - php: "8.3"
            db: mariadb-10.3
            db-image: 'mariadb:10.3'
          - php: "8.3"
            db: mariadb-10.6
            db-image: 'mariadb:10.6'
          - php: "8.5"
            db: mariadb-11.4
            db-image: 'mariadb:11.4'

    services:
      db-tests:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Lint
        uses: ./.github/actions/lint

      - name: Wait for database
        uses: ./.github/actions/wait-for-db

      - name: Test
        uses: ./.github/actions/test

      - name: Auto-approve
        if: github.actor == 'renovate[bot]'
        uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.4"
    services:
      db-tests:
        image: 'mysql/mysql-server:8.0'
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: E2E Tests
        uses: ./.github/actions/e2e-test

  simulator:
    # Boots yap under php artisan serve in fake-Twilio mode and drives real
    # calls and SMS through it with yap:simulate (#1650, #1678): routing,
    # absolute TwiML callback URLs, session cookies across webhooks, and
    # signature validation. Uploads server.log/laravel.log on failure.
    runs-on: ubuntu-latest
    name: simulator (${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
        db:
          - mysql-8.0
          - mariadb-10.3
          - mariadb-10.6
          - mariadb-11.4
        include:
          - db: mysql-8.0
            db-image: 'mysql/mysql-server:8.0'
          - db: mariadb-10.3
            db-image: 'mariadb:10.3'
          - db: mariadb-10.6
            db-image: 'mariadb:10.6'
          - db: mariadb-11.4
            db-image: 'mariadb:11.4'
    services:
      db-tests:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Wait for database
        uses: ./.github/actions/wait-for-db

      - name: Simulate calls and SMS
        uses: ./.github/actions/simulator

  package-smoke:
    # Builds the release zip and boots it (console + HTTP kernels) without the
    # dev files the zip leaves out, e.g. composer.json (#1641, #1669).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.3"
    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Build package
        run: .github/scripts/build-package.sh yap-smoke

      - name: Smoke test package
        run: .github/scripts/smoke-package.sh src/yap-smoke.zip

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: yap-package
          path: src/yap-smoke.zip
          retention-days: 7

  upgrade:
    # Upgrades a 4.5.3 database (src/tests/Fixtures/upgrade/) with the release
    # zip from package-smoke and checks the data survives (#1684): first
    # request runs the migrations, local users log in with their 4.5.3
    # passwords, BMLT-shaped rows are converted, volunteers / settings /
    # reports read back unchanged, then the simulator runs against it.
    needs: [ package-smoke ]
    runs-on: ubuntu-latest
    name: upgrade 4.5.3 (${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
        db:
          - mysql-8.0
          - mariadb-10.3
          - mariadb-10.6
          - mariadb-11.4
        include:
          - db: mysql-8.0
            db-image: 'mysql/mysql-server:8.0'
          - db: mariadb-10.3
            db-image: 'mariadb:10.3'
          - db: mariadb-10.6
            db-image: 'mariadb:10.6'
          - db: mariadb-11.4
            db-image: 'mariadb:11.4'
    services:
      db-tests:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Download package
        uses: actions/download-artifact@v6
        with:
          name: yap-package
          path: src

      - name: Wait for database
        uses: ./.github/actions/wait-for-db

      - name: Upgrade 4.5.3 database with the package
        env:
          UPGRADE_WORK_DIR: ${{ runner.temp }}/yap-upgrade
        run: .github/scripts/upgrade-test.sh src/yap-smoke.zip

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: upgrade-logs-${{ matrix.php }}-${{ matrix.db }}
          path: |
            ${{ runner.temp }}/yap-upgrade/server.log
            ${{ runner.temp }}/yap-upgrade/before.json
            ${{ runner.temp }}/yap-upgrade/package*/**/storage/logs/laravel.log
          retention-days: 30

  render-image:
    # Builds docker/Dockerfile.render (the Render Blueprint image) and boots it
    # against MySQL: config.php from env, migrations, caches, Apache on $PORT.
    runs-on: ubuntu-latest
    services:
      db:
        image: 'mysql/mysql-server:8.0'
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -f docker/Dockerfile.render -t yap-render .

      - name: Boot and health check
        run: |
          docker run -d --name yap --network host \
            -e APP_KEY="$(openssl rand -base64 32)" -e APP_ENV=demo -e LOG_CHANNEL=stderr \
            -e SESSION_DRIVER=database -e SESSION_TABLE=laravel_sessions \
            -e TWILIO_FAKE_MODE=true -e TITLE="Yap CI" \
            -e BMLT_ROOT_SERVER=https://latest.aws.bmlt.app/main_server \
            -e TWILIO_ACCOUNT_SID=AC00000000000000000000000000000000 -e TWILIO_AUTH_TOKEN=ci-token \
            -e MYSQL_HOSTNAME=127.0.0.1 -e MYSQL_PORT=3306 -e MYSQL_USERNAME=root \
            -e MYSQL_PASSWORD=yap_root_password -e MYSQL_DATABASE=yap -e MYSQL_TLS=false \
            yap-render
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:10000/ping | grep -q PONG; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:10000/ping | grep -q PONG
          curl -fsS -o /dev/null http://127.0.0.1:10000/admin
          # Code and config must not be served directly.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/config.php)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/vendor/autoload.php)" = 403

      - name: Container logs
        if: always()
        run: docker logs yap || true
