name: 'unstable'

on:
  push:
    branches: [ 'main', '4.4.x' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.3"

    services:
      db-tests:
        image: 'mysql/mysql-server:8.0'
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Lint
        uses: ./.github/actions/lint

      - name: Test w/Coverage
        uses: ./.github/actions/test-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.3"
    permissions:
      id-token: write
      contents: write
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    needs: [ lint ]
    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Build package
        id: build-package
        run: |
          export ARTIFACT_FILE=yap-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}
          echo "ARTIFACT_FILENAME=${ARTIFACT_FILE}.zip" >> $GITHUB_ENV
          .github/scripts/build-package.sh "${ARTIFACT_FILE}"

      - name: Smoke test package
        run: .github/scripts/smoke-package.sh "src/${ARTIFACT_FILENAME}"

      - name: Stage artifact
        run: |
          mkdir src/artifacts/
          mv "src/${ARTIFACT_FILENAME}" src/artifacts/

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions/gh-ci-s3-artifact
          role-session-name: gh-actions-jft
          aws-region: us-east-1

      - name: copy artifact to s3
        run: |
          aws s3 cp src/artifacts/${ARTIFACT_FILENAME} s3://${{ secrets.S3_BUCKET }}/yap/${ARTIFACT_FILENAME}
