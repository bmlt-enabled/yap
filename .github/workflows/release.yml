name: 'release'

on:
  push:
    tags: [ '*' ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - "8.3"

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Lint
        uses: ./.github/actions/lint

  test:
    runs-on: ubuntu-24.04
    name: test (${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        db:
          - mysql-8.0
        include:
          - db: mysql-8.0
            db-image: 'mysql/mysql-server:8.0'
          # MariaDB (#1679): 10.3 is the documented minimum (PreflightService::
          # MARIADB_MIN_VERSION), 10.6 the oldest LTS still common on shared
          # hosting, 11.4 a current LTS.
          - php: "8.3"
            db: mariadb-10.3
            db-image: 'mariadb:10.3'
          - php: "8.3"
            db: mariadb-10.6
            db-image: 'mariadb:10.6'
          - php: "8.5"
            db: mariadb-11.4
            db-image: 'mariadb:11.4'

    services:
      db-tests:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Lint
        uses: ./.github/actions/lint

      - name: Wait for database
        uses: ./.github/actions/wait-for-db

      - name: Test
        uses: ./.github/actions/test

  e2e:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - "8.4"
    services:
      db-tests:
        image: 'mysql/mysql-server:8.0'
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: E2E Tests
        uses: ./.github/actions/e2e-test

  simulator:
    # Boots yap under php artisan serve in fake-Twilio mode and drives real
    # calls and SMS through it with yap:simulate (#1650, #1678): routing,
    # absolute TwiML callback URLs, session cookies across webhooks, and
    # signature validation. Uploads server.log/laravel.log on failure.
    runs-on: ubuntu-24.04
    name: simulator (${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
        db:
          - mysql-8.0
          - mariadb-10.3
          - mariadb-10.6
          - mariadb-11.4
        include:
          - db: mysql-8.0
            db-image: 'mysql/mysql-server:8.0'
          - db: mariadb-10.3
            db-image: 'mariadb:10.3'
          - db: mariadb-10.6
            db-image: 'mariadb:10.6'
          - db: mariadb-11.4
            db-image: 'mariadb:11.4'
    services:
      db-tests:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Wait for database
        uses: ./.github/actions/wait-for-db

      - name: Simulate calls and SMS
        uses: ./.github/actions/simulator

  package-smoke:
    # Builds the zip exactly as the package job does and boots it, so a package
    # that can't boot fails the tag before the GitHub release is created (#1669).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - "8.3"
    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Build package
        run: .github/scripts/build-package.sh yap-smoke

      - name: Smoke test package
        run: .github/scripts/smoke-package.sh src/yap-smoke.zip

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: yap-package
          path: src/yap-smoke.zip
          retention-days: 7

  upgrade:
    # Upgrades a 4.5.3 database (src/tests/Fixtures/upgrade/) with the release
    # zip from package-smoke and checks the data survives (#1684): first
    # request runs the migrations, local users log in with their 4.5.3
    # passwords, BMLT-shaped rows are converted, volunteers / settings /
    # reports read back unchanged, then the simulator runs against it.
    needs: [ package-smoke ]
    runs-on: ubuntu-24.04
    name: upgrade 4.5.3 (${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
        db:
          - mysql-8.0
          - mariadb-10.3
          - mariadb-10.6
          - mariadb-11.4
        include:
          - db: mysql-8.0
            db-image: 'mysql/mysql-server:8.0'
          - db: mariadb-10.3
            db-image: 'mariadb:10.3'
          - db: mariadb-10.6
            db-image: 'mariadb:10.6'
          - db: mariadb-11.4
            db-image: 'mariadb:11.4'
    services:
      db-tests:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: yap-package
          path: src

      - name: Wait for database
        uses: ./.github/actions/wait-for-db

      - name: Upgrade 4.5.3 database with the package
        env:
          UPGRADE_WORK_DIR: ${{ runner.temp }}/yap-upgrade
        run: .github/scripts/upgrade-test.sh src/yap-smoke.zip

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: upgrade-logs-${{ matrix.php }}-${{ matrix.db }}
          path: |
            ${{ runner.temp }}/yap-upgrade/server.log
            ${{ runner.temp }}/yap-upgrade/before.json
            ${{ runner.temp }}/yap-upgrade/package*/**/storage/logs/laravel.log
          retention-days: 30

  create_release:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - "8.3"
    needs: [ lint, test, e2e, package-smoke, simulator, upgrade ]
    name: Create release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Generate release notes
        id: generate_release_notes
        run: |
          cd src
          cp ../RELEASENOTES.md .
          curl -LO https://raw.githubusercontent.com/bmlt-enabled/release-notes-tool/master/gh-release-notes.sh
          chmod +x gh-release-notes.sh
          ./gh-release-notes.sh RELEASENOTES.md "###"
          RELEASE_TYPE=$(if [[ "$GITHUB_REF_NAME" =~ "beta" ]]; then echo "true"; else echo "false"; fi)
          echo "RELEASE_TYPE=${RELEASE_TYPE}" >> $GITHUB_ENV

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$RELEASE_TYPE" == "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file src/changelog.txt \
            $PRERELEASE_FLAG

  package:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - "8.3"
    needs: [ lint, create_release ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Build package
        id: build-package
        run: .github/scripts/build-package.sh "yap-${GITHUB_REF##*/}"

      - name: Smoke test package
        run: .github/scripts/smoke-package.sh "src/yap-${GITHUB_REF##*/}.zip"

      - name: Release notes
        run: |
          cd src
          curl -LO https://raw.githubusercontent.com/bmlt-enabled/release-notes-tool/master/gh-release-notes.sh
          chmod +x gh-release-notes.sh
          ./gh-release-notes.sh RELEASENOTES.md "###"

      - name: Upload Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "src/yap-${GITHUB_REF##*/}.zip" --repo "$GITHUB_REPOSITORY"
