name: 'release'

on:
  push:
    tags: [ '*' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.3"

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Lint
        uses: ./.github/actions/lint

  test:
    runs-on: ubuntu-latest
    name: test (${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        db:
          - mysql-8.0
        include:
          - db: mysql-8.0
            db-image: 'mysql/mysql-server:8.0'
          # MariaDB (#1679): 10.3 is the documented minimum (PreflightService::
          # MARIADB_MIN_VERSION), 10.6 the oldest LTS still common on shared
          # hosting, 11.4 a current LTS.
          - php: "8.3"
            db: mariadb-10.3
            db-image: 'mariadb:10.3'
          - php: "8.3"
            db: mariadb-10.6
            db-image: 'mariadb:10.6'
          - php: "8.5"
            db: mariadb-11.4
            db-image: 'mariadb:11.4'

    services:
      db-tests:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Lint
        uses: ./.github/actions/lint

      - name: Wait for database
        uses: ./.github/actions/wait-for-db

      - name: Test
        uses: ./.github/actions/test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.4"
    services:
      db-tests:
        image: 'mysql/mysql-server:8.0'
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: E2E Tests
        uses: ./.github/actions/e2e-test

  simulator:
    # Boots yap under php artisan serve in fake-Twilio mode and drives real
    # calls and SMS through it with yap:simulate (#1650, #1678): routing,
    # absolute TwiML callback URLs, session cookies across webhooks, and
    # signature validation. Uploads server.log/laravel.log on failure.
    runs-on: ubuntu-latest
    name: simulator (${{ matrix.php }}, ${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
        db:
          - mysql-8.0
          - mariadb-10.3
          - mariadb-10.6
          - mariadb-11.4
        include:
          - db: mysql-8.0
            db-image: 'mysql/mysql-server:8.0'
          - db: mariadb-10.3
            db-image: 'mariadb:10.3'
          - db: mariadb-10.6
            db-image: 'mariadb:10.6'
          - db: mariadb-11.4
            db-image: 'mariadb:11.4'
    services:
      db-tests:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: yap_root_password
          MYSQL_DATABASE: yap_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3106:3306

    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Wait for database
        uses: ./.github/actions/wait-for-db

      - name: Simulate calls and SMS
        uses: ./.github/actions/simulator

  package-smoke:
    # Builds the zip exactly as the package job does and boots it, so a package
    # that can't boot fails the tag before the GitHub release is created (#1669).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.3"
    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Build package
        run: .github/scripts/build-package.sh yap-smoke

      - name: Smoke test package
        run: .github/scripts/smoke-package.sh src/yap-smoke.zip

  create_release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.3"
    needs: [ lint, test, e2e, package-smoke, simulator ]
    name: Create release
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Generate release notes
        id: generate_release_notes
        run: |
          cd src
          cp ../RELEASENOTES.md .
          curl -LO https://raw.githubusercontent.com/bmlt-enabled/release-notes-tool/master/gh-release-notes.sh
          chmod +x gh-release-notes.sh
          ./gh-release-notes.sh RELEASENOTES.md "###"
          RELEASE_TYPE=$(if [[ "$GITHUB_REF_NAME" =~ "beta" ]]; then echo "true"; else echo "false"; fi)
          echo "RELEASE_TYPE=${RELEASE_TYPE}" >> $GITHUB_ENV

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body_path: "src/changelog.txt"
          prerelease: ${{ env.RELEASE_TYPE }}

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.3"
    needs: [ lint, create_release ]
    steps:
      - uses: actions/checkout@v6
        id: code-checkout

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Install Dependencies
        uses: ./.github/actions/install-deps

      - name: Build package
        id: build-package
        run: .github/scripts/build-package.sh "yap-${GITHUB_REF##*/}"

      - name: Smoke test package
        run: .github/scripts/smoke-package.sh "src/yap-${GITHUB_REF##*/}.zip"

      - name: Release notes
        run: |
          cd src
          curl -LO https://raw.githubusercontent.com/bmlt-enabled/release-notes-tool/master/gh-release-notes.sh
          chmod +x gh-release-notes.sh
          ./gh-release-notes.sh RELEASENOTES.md "###"

      - name: Prepare artifact metadata
        id: prepare_artifact_metadata
        run: |
          echo ::set-output name=ARTIFACT_PATH::src/yap-${GITHUB_REF##*/}.zip
          echo ::set-output name=ARTIFACT_NAME::yap-${GITHUB_REF##*/}.zip

      - name: Upload Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ steps.prepare_artifact_metadata.outputs.ARTIFACT_PATH }}
          asset_name: ${{ steps.prepare_artifact_metadata.outputs.ARTIFACT_NAME }}
          asset_content_type: application/zip
